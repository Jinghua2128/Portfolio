name: Diagnose Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Query Pages projects with the configured account
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          token = os.environ["CF_TOKEN"]
          account = os.environ["CF_ACCOUNT"]
          headers = {"Authorization": f"Bearer {token}"}

          def get(url):
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except Exception as exc:
                  return {"success": False, "errors": [str(exc)]}

          accounts = get("https://api.cloudflare.com/client/v4/accounts")
          print("accounts endpoint success:", accounts.get("success"))
          print("accounts visible:", [a.get("name") for a in accounts.get("result", [])] if accounts.get("success") else accounts.get("errors"))

          projects = get(f"https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects")
          print("pages endpoint success:", projects.get("success"))
          if projects.get("success"):
              print("project count:", len(projects.get("result", [])))
              for p in projects.get("result", []):
                  print("project:", p.get("name"), "| domains:", ", ".join(p.get("domains", []) or []))
          else:
              print("pages errors:", projects.get("errors"))
          PY
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
